name: CI
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Astro check ✅
        run: npm run check

      - name: Build 🔧
        run: npm run build

      - name: Verify key routes were built 🧪
        run: |
          test -f dist/index.html
          test -f dist/eakbg-planer/index.html
          test -f dist/pdf-ratgeber/index.html
