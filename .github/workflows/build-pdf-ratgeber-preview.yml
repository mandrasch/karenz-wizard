name: Build Ratgeber PDF preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'typst/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-pdf-ratgeber-preview.yml'
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Compile PDF 🔧
        run: npm run pdf:ratgeber

      - name: Upload PDF artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: ratgeber-vaeterkarenz-pdf
          path: typst/ratgeber-vaeterkarenz.pdf
          if-no-files-found: error
