name: Build and Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Compile Ratgeber PDF 🔧
        run: npm run pdf:ratgeber

      - name: Build 🔧
        run: |
          cp typst/ratgeber-vaeterkarenz.pdf public/pdf-ratgeber/
          npm run build

      - name: 📂 Deploy via rsync
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /home/sites/site100026635/web/karenz-wizard.at/
          remote_host: ${{ secrets.RSYNC_HOST }}
          remote_user: ${{ secrets.RSYNC_USER }}
          remote_key: ${{ secrets.RSYNC_SSH_KEY }}
